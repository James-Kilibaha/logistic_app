name: logistic_app
description: "Logistic - mfumo wa usafirishaji wa mizigo kwa kampuni nyingi (SaaS)"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'   # Flutter 3.29 (Dart 3.7) au mpya zaidi

dependencies:
  flutter:
    sdk: flutter

  # Hali (state), njia (routes) na lugha
  get: '>=4.6.6 <5.0.0'
  intl: '>=0.19.0 <0.21.0'
  shared_preferences: '>=2.3.0 <3.0.0'

  # Mawasiliano na server
  chopper: '>=8.0.0 <9.0.0'
  http: '>=1.2.0 <2.0.0'

  # Picha, skana na PDF
  image_picker: '>=1.1.2 <2.0.0'
  mobile_scanner: '>=6.0.2 <8.0.0'
  qr_flutter: '>=4.1.0 <5.0.0'      # QR ya code ya ofisi (kupiga picha ya mzigo kwa simu)
  device_info_plus: '>=10.1.0 <13.0.0'  # jina la kifaa kwenye kumbukumbu za vitendo (audit)
  cached_network_image: '>=3.3.1 <4.0.0'
  syncfusion_flutter_pdfviewer: '>=28.1.33 <32.0.0'
  file_saver: '>=0.2.14 <0.4.0'
  share_plus: '>=10.1.0 <13.0.0'
  file_picker: '>=8.1.2 <11.0.0'   # kuchagua faili la Excel (kuingiza data)

  # Kupiga simu
  url_launcher: '>=6.3.0 <7.0.0'

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: '>=0.14.1 <0.15.0'
  flutter_lints: '>=5.0.0 <7.0.0'

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/

  fonts:
    - family: HurmeGeometricSans4
      fonts:
        - asset: assets/fonts/HurmeGeometricSans4-Light.otf
          weight: 400
        - asset: assets/fonts/HurmeGeometricSans4.otf
          weight: 500
        - asset: assets/fonts/HurmeGeometricSans4-SemiBold.otf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1F4FD8"
