name: Frontend Web Deploy

on:
  pull_request:
    branches:
      - main
      - uat
    types:
      - closed

jobs:
  deploy-web:
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Sync Source to Target Directory and Build
        env:
          PUB_CACHE: /Data/pub-cache
        run: |
          set -e
          echo "Determining target environment..."
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            TARGET_DIR="/Data/www/logistics/prod/frontend"
          elif [[ "$TARGET_BRANCH" == "uat" ]]; then
            TARGET_DIR="/Data/www/logistics/uat/frontend"
          else
            echo "Error: Unknown target branch $TARGET_BRANCH"
            exit 1
          fi
          
          echo "Syncing source code to $TARGET_DIR..."
          mkdir -p "$TARGET_DIR"
          
          # Copy source files (excluding .git and build folders) to the target directory
          rsync -av --delete --exclude='.git' --exclude='build' --exclude='.dart_tool' ./ "$TARGET_DIR/"
          
          echo "Entering target directory and building Flutter web app..."
          cd "$TARGET_DIR"
          
          # Ensure local user path includes Flutter SDK and custom pub cache
          export PATH="/home/ppfintech01/flutter/bin:$PATH"
          
          # Run flutter pub get and build web release directly inside the target folder using /Data/pub-cache
          flutter pub get
          flutter build web --release
          
          echo "Build complete directly in $TARGET_DIR!"