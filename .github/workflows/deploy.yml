name: Frontend Web Deploy

on:
  pull_request:
    branches:
      - main
      - uat
    types:
      - closed

jobs:
  deploy-web:
    # Only run if the PR was actually merged (not just closed without merging)
    if: github.event.pull_request.merged == true
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Web Release
        run: |
          echo "Building Flutter web release..."
          flutter pub get
          flutter build web --release

      - name: Deploy to Server
        run: |
          echo "Starting frontend deployment..."
          
          # Check which branch it was merged into
          TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
          
          if [[ "$TARGET_BRANCH" == "main" ]]; then
            echo "Deploying Frontend to Production..."
            rsync -av --delete build/web/ /Data/www/logistics/prod/frontend/
            echo "Production frontend deployment complete!"
          elif [[ "$TARGET_BRANCH" == "uat" ]]; then
            echo "Deploying Frontend to UAT..."
            rsync -av --delete build/web/ /Data/www/logistics/uat/frontend/
            echo "UAT frontend deployment complete!"
          fi