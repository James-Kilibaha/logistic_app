name: Frontend Web Deploy

on:
  push:
    branches:
      - main
      - uat

jobs:
  deploy-web:
    runs-on: self-hosted

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Build Web Release
        run: |
          echo "Building Flutter web release..."
          flutter pub get
          flutter build web --release

      - name: Deploy to Server
        run: |
          echo "Starting frontend deployment..."
          
          # If pushing to main (Production)
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "Deploying Frontend to Production..."
            rsync -av --delete build/web/ /Data/www/logistics/prod/frontend/
            echo "Production frontend deployment complete!"
          
          # If pushing to uat (UAT)
          elif [[ "${{ github.ref }}" == "refs/heads/uat" ]]; then
            echo "Deploying Frontend to UAT..."
            rsync -av --delete build/web/ /Data/www/logistics/uat/frontend/
            echo "UAT frontend deployment complete!"
          fi