# Kila push / pull request: uchambuzi (analyze), majaribio (test) na kujenga web.
name: logistic_app

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.1'
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Tests
        run: flutter test
      - name: Build web
        run: flutter build web --release --dart-define=API_SERVER=${{ vars.API_SERVER || 'http://localhost:8000' }}
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web
          retention-days: 7
